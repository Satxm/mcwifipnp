buildscript {
    repositories {
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

plugins {
    id 'idea'
    id 'eclipse'
    id("com.github.johnrengelman.shadow") version("4.0.4")
}
apply plugin: 'forge'

sourceCompatibility = targetCompatibility = 1.8

version = mod_version
group= mod_group
archivesBaseName = mod_id

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
	mappings = 'stable_12'
}

def refMap = "${tasks.compileJava.temporaryDir}" + File.separator + "mixins.${archivesBaseName}.refmap.json"
def mixinSrg = "${tasks.reobf.temporaryDir}" + File.separator + "mixins.srg"
afterEvaluate {
    tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${mixinSrg}", "-AoutRefMapFile=${refMap}"]
}

reobf {
    addExtraSrgFile mixinSrg
}

repositories {
	jcenter()
    maven {
        name = "Overmind forge repo mirror"
        url = "https://gregtech.overminddl1.com/"
    }
	maven {
		name = 'sponge'
		url = 'https://repo.spongepowered.org/maven'
	}
    maven {
        url = "https://jitpack.io"
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
        annotationProcessor("org.ow2.asm:asm-debug-all:5.0.3")
        annotationProcessor("com.google.guava:guava:24.1.1-jre")
        annotationProcessor("com.google.code.gson:gson:2.8.6")
        annotationProcessor("org.spongepowered:mixin:0.8-SNAPSHOT")
        // using 0.8 to workaround a issue in 0.7 which fails mixin application
        shade("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
            // Mixin includes a lot of dependencies that are too up-to-date
            exclude module: "launchwrapper"
            exclude module: "guava"
            exclude module: "gson"
            exclude module: "commons-io"
            exclude module: "log4j-core"
        }
        compile("com.github.GTNewHorizons:SpongeMixins:1.3.3:dev")
}

jar {
	archiveClassifier = 'slim'

    from refMap
    manifest.attributes(
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': "mixins.${mod_id}.json",
            'FMLCorePluginContainsFMLMod': 'true',
            "MixinCompatibilityLevel": "JAVA_8"
    )
}

shadowJar {
    archiveClassifier = ''
    
    from refMap
    configurations = [project.configurations.shade]
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
    addExtraSrgFile mixinSrg
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

runClient {
	args "--tweakClass org.spongepowered.asm.launch.MixinTweaker --mixin mixins.mcwifipnp.json"
}

runServer {
	args "--tweakClass org.spongepowered.asm.launch.MixinTweaker --mixin mixins.mcwifipnp.json"
}
