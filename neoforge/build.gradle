plugins {
  id 'java'
  id 'eclipse'
  id 'idea'
  id 'net.neoforged.moddev' version '2.+'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

version = project.mod_version + "-" + project.minecraft_version + "-neoforge"
group = project.mod_group_id
base.archivesName = project.mod_id

repositories {
  mavenLocal()
}

neoForge {
  version = project.neo_version

  runs {
    configureEach {
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }

    client {
      client()
    }

    server {
      server()
      programArgument '--nogui'
    }

    gameTestServer {
      type = "gameTestServer"
    }

    data {
      clientData()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
  }

  mods {
    "${mod_id}" {
      sourceSet(sourceSets.main)
    }
  }
}

sourceSets.main {
  java {
    srcDir "../src/main/java"
  }
  resources {
    srcDir "../src/main/resources"
    srcDir "src/generated/resources"
  }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(ProcessResources).configureEach {
  var replaceProperties = [
    mod_version: project.mod_version,
    neo_version_range : project.neo_version_range,
    minecraft_version_min : project.minecraft_version_min,
    minecraft_version_max : project.minecraft_version_max,
    neo_loader_version_range : project.neo_loader_version_range,
    pack_format_number: project.pack_format_number,
  ]
  inputs.properties replaceProperties
  filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
    expand replaceProperties
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = 'UTF-8'
  it.options.release = 21
}

java.withSourcesJar()

jar {
  from("../LICENSE") {
  }
}

idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}