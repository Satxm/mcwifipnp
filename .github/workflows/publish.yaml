name: Build and Publish

on:
  workflow_dispatch:

env:
  java-version: '21'
  modrinth-id: RTWpcTBp
  curseforge-id: 450250

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK ${{ env.java-version }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ env.java-version }}
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

    - name: Make Gradle Wrapper Executable
      if: ${{ runner.os != 'Windows' }}
      run: chmod +x ./gradlew
      
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Get Name form files
      run: |
        fabric_name=$(basename fabric/build/libs/!(*-@(dev|sources|javadoc)).jar | sed 's/\.jar//' | sed 's/mcwifipnp-//')
        forge_name=$(basename forge/build/libs/!(*-@(dev|sources|javadoc)).jar | sed 's/\.jar//' | sed 's/mcwifipnp-//')
        neoforge_name=$(basename neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar | sed 's/\.jar//' | sed 's/mcwifipnp-//')
        quilt_name=$(basename quilt/build/libs/!(*-@(dev|sources|javadoc)).jar | sed 's/\.jar//' | sed 's/mcwifipnp-//')
        set_action_env "FABRIC_NAME" "${fabric_name}"
        set_action_env "FORGE_NAME" "${forge_name}"
        set_action_env "NEOFORGE_NAME" "${neoforge_name}"
        set_action_env "QUILT_NAME" "${quilt_name}"
  
    - name: Publish (Fabric)
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.modrinth-id }}
        modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.FABRIC_NAME }}
        version-type: release
        files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
        java: Java ${{ env.java-version }}

    - name: Publish (Forge)
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.modrinth-id }}
        modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.FORGE_NAME }}
        version-type: release
        files: forge/build/libs/!(*-@(dev|sources|javadoc|slim)).jar
        java: Java ${{ env.java-version }}

    - name: Publish (NeoForge)
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.modrinth-id }}
        modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.NEOFORGE_NAME }}
        loaders: neoforge
        version-type: release
        files: neoforge/build/libs/!(*-@(dev|sources|javadoc|slim)).jar
        java: Java ${{ env.java-version }}

    - name: Publish (Quilt)
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.modrinth-id }}
        modrinth-token: "${{ secrets.MODRINTH_TOKEN }}"
        curseforge-id: ${{ env.curseforge-id }}
        curseforge-token: "${{ secrets.CURSEFORGE_TOKEN }}"

        name: ${{ env.QUILT_NAME }}
        loaders: quilt
        version-type: release
        files: quilt/build/libs/!(*-@(dev|sources|javadoc|slim)).jar
        java: Java ${{ env.java-version }}
